name: evals

# Reruns local plugins' claude plugin eval cases, one job per plugin. Needs
# the ANTHROPIC_API_KEY repo secret; each job skips with a notice without
# it, so forks and PRs from outside stay green.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # shortcut: workflow-level paths fit while flow is the only job; a second
    # plugin's job needs per-job change detection instead.
    paths:
      - "plugins/flow/skills/**"
      - "plugins/flow/agents/**"
      - "plugins/flow/hooks/**"
      - "plugins/flow/evals/**"

permissions:
  contents: read

jobs:
  # When flow's skills, agents (including a model pin in agents/*.md), hooks,
  # or evals change.
  flow:
    # Skip draft PRs; ready_for_review runs them once marked ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY not set; skipping flow evals"
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_KEY == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - if: env.HAS_KEY == 'true'
        working-directory: plugins/flow
        # Only this step gets the key, not checkout or the npm install.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          claude plugin eval . --scaffold --trust-plugin --no-publish
          --ablation none --runs 1 -j 4 --threshold 1.0
          --allow-tools 'Bash(git:*)'
