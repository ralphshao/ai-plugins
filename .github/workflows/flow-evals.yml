name: flow evals

# Reruns flow's claude plugin eval cases when its skills, agents (including
# a model pin in agents/*.md), hooks, or evals change. Needs the
# ANTHROPIC_API_KEY repo secret; skips with a notice without it, so forks
# and PRs from outside stay green.
on:
  pull_request:
    paths:
      - "plugins/flow/skills/**"
      - "plugins/flow/agents/**"
      - "plugins/flow/hooks/**"
      - "plugins/flow/evals/**"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY not set; skipping flow evals"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v5
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - if: env.ANTHROPIC_API_KEY != ''
        working-directory: plugins/flow
        run: >-
          claude plugin eval . --scaffold --trust-plugin --no-publish
          --ablation none --runs 1 -j 4 --threshold 1.0
          --allow-tools 'Bash(git:*)'
