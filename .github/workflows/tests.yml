name: tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pytest:
    # Skip draft PRs; ready_for_review runs them once marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # Oldest supported; also covers rmtree's pre-3.12 onerror branch.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # pwsh is preinstalled on all GitHub-hosted runners, so the .ps1
      # wrapper tests run everywhere; the .sh ones run on Linux and macOS.
      - run: python -m pytest

  lint:
    # Skip draft PRs; ready_for_review runs them once marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      # Versions are pinned so a new release can't turn main red; bump them
      # here and in AGENTS.md together. shellcheck-py ships the shellcheck
      # binary, so CI and a local `uv run` use the same one.
      - run: python -m pip install ruff==0.17.5 shellcheck-py==0.11.0.1
      - run: ruff check
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
      # validate reads only local files: no API key or login needed.
      - run: npm install -g @anthropic-ai/claude-code@2.1.326
      - run: |
          claude plugin validate . --strict
          for plugin in plugins/*/; do
            claude plugin validate "$plugin" --strict
          done
