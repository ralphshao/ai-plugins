name: tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pytest:
    # Skip draft PRs; ready_for_review runs them once marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # Oldest supported; also covers rmtree's pre-3.12 onerror branch.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # pwsh is preinstalled on all GitHub-hosted runners, so the .ps1
      # wrapper tests run everywhere; the .sh ones run on Linux and macOS.
      - run: python -m pytest
